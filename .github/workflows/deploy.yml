# Builds on every push to main and publishes it twice:
# - to the gh-pages branch, which DigitalOcean App Platform serves as portfolio.ahusan.dev
# - to GitHub Pages (ahusan.github.io) as a backup. Needs Settings > Pages > Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Adds a commit on top of gh-pages (history kept), which triggers the DigitalOcean deploy.
      - name: Publish build to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --yes gh-pages@6 -d build -m "Deploy ${GITHUB_SHA::7}" \
            -r "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
